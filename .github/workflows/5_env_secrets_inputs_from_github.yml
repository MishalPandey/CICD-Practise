name: Demo CI Env Secrets from GitHub

on:
  push:
  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from the second pipeline!"

      - name: Install
        env:
          APP_ENV: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Hello from the second pipeline! APP_ENV = $APP_ENV, DB_PASSWORD = $DB_PASSWORD"