name: Demo CI Env Secrets from GitHub

on:
#  push:
#  pull_request:

  workflow_dispatch:

env:
  Global_Env_Var: "This is a global environment variable"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
        Job_Env_Var: "This is a job-level environment variable"

    steps:
      - name: Say Hello
        run: echo "Hello from the second pipeline!"

      - name: Install
        env:
          APP_ENV: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Hello from the second pipeline! APP_ENV = $APP_ENV, DB_PASSWORD = $DB_PASSWORD , Global_Env_Var = $Global_Env_Var, Job_Env_Var = $Job_Env_Var"