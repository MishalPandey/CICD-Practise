name: Inbuilt Actions Uses at Runner with its Inputs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from the second pipeline!"

      - name: Install
        env:
          APP_ENV: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Hello from the second pipeline!"
          echo "APP_ENV = $APP_ENV"
          if [ -n "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD secret is configured"
          else
            echo "DB_PASSWORD secret is not configured"
          fi

      - name: Create demo file
        run: |
          echo "This is a demo file created by the workflow." > demo.txt
          echo "File created successfully."

      - name: Upload Demo
        uses: actions/upload-artifact@v4
        with:
          name: build-demo-artifact
          path: demo.txt
