name: Hello Spring Boot App to Docker

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and Test Application
        working-directory: ./CICD
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: CICD/build/reports/tests/test/
          if-no-files-found: ignore

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./CICD
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-spring-boot:latest
            ${{ secrets.DOCKER_USERNAME }}/hello-spring-boot:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/hello-spring-boot:${{ github.ref_name }}
