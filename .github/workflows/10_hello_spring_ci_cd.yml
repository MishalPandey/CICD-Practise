name: Hello Spring Boot App to AWS EKS Cluster

on:
  push:
    paths:
        - 'src/**'
        - 'build.gradle'
        - 'settings.gradle'
        - 'gradle/**'
        - .github/workflows/10_hello_spring_ci_cd.yml
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and Test Application
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR for Docker
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-spring-boot:latest
            ${{ secrets.DOCKER_USERNAME }}/hello-spring-boot:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/hello-spring-boot:${{ github.ref_name }}

  deploy-to-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name hello-cluster --region ap-south-1

      - name: Verify connection to EKS cluster
        run: |
          kubectl get nodes
          kubectl get pods --all-namespaces

      - name: Deploy to AWS EKS
        run: kubectl apply -f 2_aws_k8s_Deployment_of_app1-hello
     

