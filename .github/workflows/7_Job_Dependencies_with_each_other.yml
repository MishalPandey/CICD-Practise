name: Dependency Jobs Workflow

on:
#  push:
#  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from the inbuilt actions workflow!"

      - name: Install
        env:
          APP_ENV: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Hello from the inbuilt actions workflow!"
          echo "APP_ENV = $APP_ENV"
          if [ -n "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD secret is configured"
          else
            echo "DB_PASSWORD secret is not configured"
          fi

      - name: Create demo file
        run: |
          echo "This is a demo file created by the workflow." > demo.txt
          echo "File created successfully."

      - name: Upload Demo
        uses: actions/upload-artifact@v4
        with:
          name: build-demo-artifact
          path: demo.txt


  test:
    runs-on: ubuntu-latest
    needs: build  #It means that the test job will only run after the build job has completed successfully.
#    This ensures that the test job has access to any artifacts or outputs produced by the build job.

    steps:
      - name: Test Job
        run: echo "Test job completed!"
