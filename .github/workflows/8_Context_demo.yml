name: Context Object Demo

run-name: ${{ github.actor }} is testing out GitHub Actions Context Object

on:
#  push:
  workflow_dispatch:
jobs:
  Explore-Github-Context-Object:
    runs-on: ubuntu-latest

    steps:
      - name: Display Trigger Event
        run: echo "This job was automatically triggered by ${{ github.event_name }} event."

      - name: Display Runner OS
        run: echo "The job is running on ${{ runner.os }} hosted runner by GitHub."

      - name: Display Repository Information
        run: |
          echo "Branch/ref: ${{ github.ref }}"
          echo "Commit message: ${{ github.event.head_commit.message }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Display Workspace
        run: echo "The ${{ github.repository }} repository has been checked out to ${{ github.workspace }}."

      - name: Ready Message
        run: echo "The workflow is now ready to test your code on the runner."

      - name: List Files in the Repository
        run: |
          ls -la "${{ github.workspace }}"

      - name: Display Job Status
        if: always()
        run: echo "This job status is ${{ job.status }}"
